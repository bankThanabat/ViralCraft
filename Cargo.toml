[workspace]
resolver = "2"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
model = { path = "crates/model" }

# Dependencies (FFT, image decoding, ONNX inference) are compute-heavy and
# make debug-mode tests slow; optimize them while keeping our code debuggable.
[profile.dev.package."*"]
opt-level = 2

# Test builds get light optimization so the fast suite stays under 2 s;
# `cargo build` and debugging keep the unoptimized dev profile.
[profile.test]
opt-level = 1
